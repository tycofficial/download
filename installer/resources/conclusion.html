<h1>安装完成</h1>
<p>现在可以在“应用程序”中打开：</p>
<ul><li><b>Clash Verge</b>：导入你自己的订阅，选好节点，再开启系统代理。</li><li><b>Codex</b>：登录自己的账号，打开项目开始使用。</li></ul>
<p>如果应用没有自动出现，请从 Finder 的“应用程序”文件夹手动打开。首次启动时，请按 macOS 提示确认权限。</p>
<p>此包为 Monterey 保留 Codex 旧桌面版；部分电脑操作等附加功能需要更高版本系统。</p>
</body></html>
