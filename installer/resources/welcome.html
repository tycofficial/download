<h1>一次安装，两个桌面应用</h1>
<p>适用于你的 <b>Intel Mac · macOS Monterey 12.7.6</b>。</p>
<h2>内置程序</h2>
<ul><li><b>Clash Verge Rev 2.5.10</b>：使用你自己的 Clash / Mihomo 订阅。</li><li><b>Codex 26.623.141536</b>：官方旧版桌面图形应用。</li></ul>
<p>安装文件已全部内置，无需再次联网下载。点击“继续”，按 macOS 提示完成安装。</p>
<p class="muted">安装前请退出两个应用，并至少留出 4 GB 空间。安装完成后，上网代理仍需导入订阅，Codex 仍需联网登录。</p>
